name: app
description: "WorkMan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  # Flutter's own texts (date pickers, tooltips) in the app's languages; it
  # fixes the version of intl.
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.3
  file_picker: ^10.3.3
  toastification: ^3.0.2
  # AppImage (core/uploads.dart): images are kept on the device once loaded.
  cached_network_image: ^3.4.1
  # The charts (core/charts.dart).
  fl_chart: ^1.1.1
  # The app's font (theme.dart's appFont), fetched once and kept on the device.
  google_fonts: ">=6.2.1 <9.0.0"
  # The icon sets (core/icons.dart). hugeicons stays on 0.0.11: later versions
  # draw SVG paths instead of an icon font, so they cannot be IconData.
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.21
  hugeicons: 0.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
